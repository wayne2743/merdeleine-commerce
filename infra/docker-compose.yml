x-java-service: &java-service
  restart: unless-stopped
  build:
    context: ..
    dockerfile: infra/Dockerfile.spring-service
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_started
  environment: &java-service-env
    SPRING_DATASOURCE_USERNAME: merdeleine
    SPRING_DATASOURCE_PASSWORD: merdeleine_pw
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    INTERNAL_SECRET: ${INTERNAL_SECRET:-merdeleine-internal-secret}

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 容器內服務走 kafka:29092；主機若需直接連 Kafka，預設走 localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${DOCKER_HOST_IP:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    hostname: kafka-ui
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  postgres:
    image: postgres:16
    hostname: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: merdeleine
      POSTGRES_PASSWORD: merdeleine_pw
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merdeleine -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  catalog-service:
    <<: *java-service
    container_name: catalog-service
    build:
      context: ..
      dockerfile: infra/Dockerfile.spring-service
      args:
        GRADLE_TASK: :services:catalog-service:bootJar
        MODULE_DIR: services/catalog-service
    ports:
      - "8081:8081"
    environment:
      <<: *java-service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
      SERVER_PORT: 8081
      THRESHOLD_SERVICE_BASE_URL: http://threshold-service:8087
      APP_SERVICES_ORDER_BASE_URL: http://order-service:8083
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_CDN_BASE_URL: ${AWS_CDN_BASE_URL:-}

  notification-service:
    <<: *java-service
    container_name: notification-service
    build:
      context: ..
      dockerfile: infra/Dockerfile.spring-service
      args:
        GRADLE_TASK: :services:notification-service:bootJar
        MODULE_DIR: services/notification-service
    ports:
      - "8082:8082"
    environment:
      <<: *java-service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SERVER_PORT: 8082
      SERVICES_ORDER_SERVICE_BASE_URL: http://order-service:8083
      SERVICES_API_GATEWAY_BASE_URL: http://api-gateway-bff:8089

  order-service:
    <<: *java-service
    container_name: order-service
    build:
      context: ..
      dockerfile: infra/Dockerfile.spring-service
      args:
        GRADLE_TASK: :services:order-service:bootJar
        MODULE_DIR: services/order-service
    ports:
      - "8083:8083"
    environment:
      <<: *java-service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SERVER_PORT: 8083

  payment-service:
    <<: *java-service
    container_name: payment-service
    build:
      context: ..
      dockerfile: infra/Dockerfile.spring-service
      args:
        GRADLE_TASK: :services:payment-service:bootJar
        MODULE_DIR: services/payment-service
    ports:
      - "8084:8084"
    environment:
      <<: *java-service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SERVER_PORT: 8084
      ORDER_SERVICE_BASE_URL: http://order-service:8083
      CATALOG_SERVICE_BASE_URL: http://catalog-service:8081
      API_GATEWAY_BASE_URL: http://api-gateway-bff:8089
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}

  production-planning-service:
    <<: *java-service
    container_name: production-planning-service
    build:
      context: ..
      dockerfile: infra/Dockerfile.spring-service
      args:
        GRADLE_TASK: :services:production-planning-service:bootJar
        MODULE_DIR: services/production-planning-service
    ports:
      - "8085:8085"
    environment:
      <<: *java-service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/production_planning_db
      SERVER_PORT: 8085
      APP_CLIENTS_CATALOG_BASE_URL: http://catalog-service:8081
      SERVICES_ORDER_SERVICE_BASE_URL: http://order-service:8083

  production-service:
    <<: *java-service
    container_name: production-service
    build:
      context: ..
      dockerfile: infra/Dockerfile.spring-service
      args:
        GRADLE_TASK: :services:production-service:bootJar
        MODULE_DIR: services/production-service
    ports:
      - "8086:8086"
    environment:
      <<: *java-service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/production_db
      SERVER_PORT: 8086
      SERVICES_ORDER_SERVICE_BASE_URL: http://order-service:8083

  threshold-service:
    <<: *java-service
    container_name: threshold-service
    build:
      context: ..
      dockerfile: infra/Dockerfile.spring-service
      args:
        GRADLE_TASK: :services:threshold-service:bootJar
        MODULE_DIR: services/threshold-service
    ports:
      - "8087:8087"
    environment:
      <<: *java-service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/threshold_db
      SERVER_PORT: 8087

  api-gateway-bff:
    restart: unless-stopped
    container_name: api-gateway-bff
    build:
      context: ..
      dockerfile: infra/Dockerfile.spring-service
      args:
        GRADLE_TASK: :services:api-gateway-bff:bootJar
        MODULE_DIR: services/api-gateway-bff
    depends_on:
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started
      order-service:
        condition: service_started
      payment-service:
        condition: service_started
      production-planning-service:
        condition: service_started
      notification-service:
        condition: service_started
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gateway_db
      SPRING_DATASOURCE_USERNAME: merdeleine
      SPRING_DATASOURCE_PASSWORD: merdeleine_pw
      SERVER_PORT: 8089
      INTERNAL_SECRET: ${INTERNAL_SECRET:-merdeleine-internal-secret}
      JWT_SECRET: ${JWT_SECRET:-merdeleine-secret-key-must-be-at-least-256bits-long!}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      LINE_CLIENT_ID: ${LINE_CLIENT_ID:-}
      LINE_CLIENT_SECRET: ${LINE_CLIENT_SECRET:-}
      APP_SERVICES_ORDER_BASE_URL: http://order-service:8083
      APP_SERVICES_CATALOG_BASE_URL: http://catalog-service:8081
      APP_SERVICES_PAYMENT_BASE_URL: http://payment-service:8084
      APP_SERVICES_PRODUCTION_PLANNING_BASE_URL: http://production-planning-service:8085
      APP_SERVICES_NOTIFICATION_BASE_URL: http://notification-service:8082
      NOTIFICATION_SERVICE_BASE_URL: http://notification-service:8082

volumes:
  pgdata:
