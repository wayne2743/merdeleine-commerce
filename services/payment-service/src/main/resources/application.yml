server:
  port: 8084

spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: 100.113.120.124:9092
    listener:
      ack-mode: manual_immediate
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true # 這樣就會在 Kafka 消息頭中添加類型信息，方便消費者反序列化
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.merdeleine.messaging"
        spring.json.use.type.headers: true # 這樣就會使用 Kafka 消息頭中的類型信息來反序列化，而不是全局默認類型

  datasource:
    url: jdbc:postgresql://100.113.120.124:5432/payment_db
    username: merdeleine
    password: merdeleine_pw
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # 你已經用 SQL 建表，建議 validate；開發期也可用 update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        # 建議明確指定 dialect（Hibernate 6 通常可自動判斷，不寫也行）
        dialect: org.hibernate.dialect.PostgreSQLDialect
  jackson:
    time-zone: UTC



app:
  kafka:
    consumer:
      group-id: payment-service-group
    topic:
      payment-expired: payment.expired.v1
      payment-requested-events: payment.requested.v1
      payment-created-events: payment.created.v1
      payment-completed-events: payment.completed.v1
      payment-failed-events: payment.failed.v1
  outbox:
    publish-interval-ms: 5000
  internal:
    secret: ${INTERNAL_SECRET:merdeleine-internal-secret}

services:
  order-service:
    base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8083}
  catalog-service:
    base-url: ${CATALOG_SERVICE_BASE_URL:http://localhost:8081}
  api-gateway:
    base-url: ${API_GATEWAY_BASE_URL:http://localhost:8089}

newebpay:
  env: ${NEWEBPAY_ENV:stage} # stage | prod
  merchant-id: ${NEWEBPAY_MERCHANT_ID:}
  hash-key: ${NEWEBPAY_HASH_KEY:}
  hash-iv: ${NEWEBPAY_HASH_IV:}
  public-base-url: ${PAYMENT_PUBLIC_BASE_URL:http://localhost:8084}
  frontend-return-url: ${PAYMENT_FRONTEND_RETURN_URL:http://localhost:5173/payment/result}
  mpg-version: "2.3"
  close-version: "1.1"
  stage-mpg-url: https://ccore.newebpay.com/MPG/mpg_gateway
  prod-mpg-url: https://core.newebpay.com/MPG/mpg_gateway
  stage-close-url: https://ccore.newebpay.com/API/CreditCard/Close
  prod-close-url: https://core.newebpay.com/API/CreditCard/Close

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
